name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worldline-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify release and build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\\.[0-9]+\\.[0-9]+", tag):
              raise SystemExit(f"Expected a stable semantic-version tag, got {tag!r}")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          source = Path("src/worldline/__init__.py").read_text()
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match pyproject version {version}")
          if f'__version__ = "{version}"' not in source:
              raise SystemExit("src/worldline/__init__.py version does not match pyproject.toml")
          print(f"Verified WORLDLINE {version}")
          PY
      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build twine
      - name: Run release test suite
        run: |
          python -m compileall -q src tests
          bash -n scripts/worldline-install.sh
          bash -n scripts/install_user_service.sh
          bash -n update.sh
          bash tests/installer.sh
          python -m pytest
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: worldline-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-github-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: verify-and-build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: worldline-distributions
          path: dist
      - name: Create release with verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --title "WORLDLINE $RELEASE_TAG" \
            --generate-notes
