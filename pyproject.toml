[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldline"
version = "0.1.0"
description = "Persistent world-model and execution substrate for agents operating a real computer"
requires-python = ">=3.11"
authors = [{name = "Ryan Raposo"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
worldline = "worldline.daemon:main"
worldlinectl = "worldline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
