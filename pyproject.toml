[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldline"
version = "0.2.0"
description = "WORLDLINE: Operating Fact — a live, revisioned view of what the machine knows now."
requires-python = ">=3.11"
authors = [{name = "Ryan Raposo"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
worldline = "worldline.cli:main"
worldline-daemon = "worldline.daemon:main"
worldlinectl = "worldline.control:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
